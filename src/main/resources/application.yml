spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docflow}
    username: ${SPRING_DATASOURCE_USERNAME:docflow}
    password: ${SPRING_DATASOURCE_PASSWORD:docflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

docflow:
  jwt:
    secret: ${DOCFLOW_JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
    expiration-ms: ${DOCFLOW_JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

logging:
  level:
    com.docflow: INFO
    org.springframework.security: WARN
