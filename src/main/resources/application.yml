spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docflow}
    username: ${SPRING_DATASOURCE_USERNAME:docflow}
    password: ${SPRING_DATASOURCE_PASSWORD:docflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

docflow:
  jwt:
    # DOCFLOW_JWT_SECRET is required — no default to avoid accidental use of a weak key in production.
    # For local development without Docker, set: export DOCFLOW_JWT_SECRET=<at-least-32-random-chars>
    secret: ${DOCFLOW_JWT_SECRET}
    expiration-ms: ${DOCFLOW_JWT_EXPIRATION_MS:86400000}

server:
  port: ${PORT:8080}

logging:
  level:
    com.docflow: INFO
    org.springframework.security: WARN

